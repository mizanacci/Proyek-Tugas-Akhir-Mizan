; platformio.ini — Konfigurasi proyek firmware ESP32
; Tugas Akhir SCADA Distribusi Listrik — Almar'u Zaim Mizan (04231006)
;
; [DRAF] Versi library di bawah adalah versi yang tersedia/stabil pada saat
; dokumen ini disusun. Jalankan `pio pkg update` dan verifikasi ulang
; changelog masing-masing library sebelum implementasi akhir, terutama
; ModbusRTU (emelianov/modbus-esp8266) karena API-nya sempat mengalami
; perubahan penamaan master/slave -> client/server di beberapa rilis.

[env:esp32devkitv4]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    emelianov/modbus-esp8266 @ ^4.1.0
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^6.21.5
    adafruit/Adafruit ADS1X15 @ ^2.5.0

; Flag build tambahan bila diperlukan (mis. menaikkan ukuran buffer TLS
; default WiFiClientSecure) — [DRAF, aktifkan sesuai kebutuhan saat
; ditemukan masalah memori pada pengujian nyata]
; build_flags =
;     -D CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=4096

; Partisi default esp32dev umumnya cukup untuk proyek ini (tanpa OTA
; besar/SPIFFS besar). Jika kelak firmware membengkak dan build gagal
; karena ukuran, pertimbangkan board_build.partitions custom.
