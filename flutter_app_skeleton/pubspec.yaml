name: scada_mizan_app
description: "Aplikasi monitoring & kontrol SCADA Distribusi Listrik — Tugas Akhir Almar'u Zaim Mizan (04231006)"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # --- MQTT (HiveMQ Cloud) ---
  mqtt_client: ^10.3.1        # [DRAF] verifikasi versi terbaru di pub.dev sebelum implementasi akhir

  # --- Firebase ---
  firebase_core: ^2.27.0      # [DRAF] verifikasi kompatibilitas versi antar-paket firebase_* sebelum implementasi akhir
  firebase_auth: ^4.17.0
  firebase_database: ^10.4.0
  google_sign_in: ^6.2.1

  # --- State management sederhana (opsional, boleh diganti Provider/Riverpod/Bloc
  #     sesuai preferensi — proyek ini memakai ChangeNotifier bawaan Flutter agar
  #     minim dependency tambahan untuk skala prototipe TA) ---
  provider: ^6.1.1

  # --- Utilitas ---
  intl: ^0.19.0                # format tanggal/waktu untuk layar Data Activity

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/scada_mizan_app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FDFDFD"
  adaptive_icon_foreground: "assets/images/scada_mizan_app_icon.png"

flutter_native_splash:
  color: "#021830"
  image: "assets/images/scada_mizan_splash.png"
  android_12:
    color: "#021830"
    image: "assets/images/scada_mizan_app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
